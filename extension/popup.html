<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 340px; margin: 0; font: 14px/1.45 system-ui, "Segoe UI", sans-serif; background: #0a0a0a; color: #f5f5f5; }
    main { padding: 14px; }
    h1 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
    .mark { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: #22c55e; color: #04140a; font-weight: 800; font-size: 13px; }
    .status { font-size: 12px; color: #9a9a9a; margin: 2px 0; }
    .ok { color: #22c55e; } .bad { color: #fbbf24; }
    .card { margin-top: 12px; padding: 10px; border: 1px solid #262626; border-radius: 10px; background: #121212; display: grid; grid-template-columns: 64px 1fr; gap: 10px; }
    .card img { width: 64px; height: 64px; object-fit: contain; background: #fff; border-radius: 8px; }
    .title { font-size: 13px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .price { color: #22c55e; font-weight: 700; margin-top: 4px; }
    .old { color: #9a9a9a; text-decoration: line-through; font-size: 12px; margin-left: 6px; font-weight: 400; }
    button { width: 100%; margin-top: 12px; padding: 10px; border: 0; border-radius: 999px; background: #22c55e; color: #04140a; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    .msg { margin-top: 10px; font-size: 13px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1><span class="mark">A</span> AchoFiliado</h1>
    <p class="status" id="robot">Robô: verificando...</p>
    <p class="status" id="ml">Mercado Livre: verificando...</p>

    <div id="product" class="card" hidden>
      <img id="img" alt="">
      <div>
        <div class="title" id="title"></div>
        <div class="price" id="price"></div>
      </div>
    </div>
    <p class="msg" id="hint" hidden>Abra a página de um produto do Mercado Livre para adicioná-lo à Vitrine.</p>
    <button id="add" hidden>Adicionar à Vitrine</button>
    <p class="msg" id="msg"></p>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
