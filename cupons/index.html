<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cupons de desconto - Vini Achados</title>
  <meta name="description" content="Cupons de desconto da Amazon, Shopee e Mercado Livre, com o código pronto para copiar.">
  <style>
    :root { --bg:#0b0b0d; --card:#15151a; --line:#26262e; --text:#f3f4f6; --muted:#9ca3af; --accent:#f26522; --green:#22c55e; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
    header strong { font-size:1.05rem; }
    nav a { color:var(--muted); text-decoration:none; margin-left:14px; font-size:.92rem; }
    nav a.on { color:var(--text); border-bottom:2px solid var(--accent); padding-bottom:2px; }
    main { max-width:1200px; margin:0 auto; padding:16px; }
    .bar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
    .bar input { flex:1 1 220px; background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font:inherit; }
    .chips { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
    .chip { background:var(--card); border:1px solid var(--line); color:var(--muted); border-radius:999px; padding:6px 14px; cursor:pointer; font:inherit; font-size:.88rem; }
    .chip.on { color:#fff; border-color:var(--accent); background:rgba(242,101,34,.15); }
    .count { color:var(--muted); font-size:.88rem; margin:0 0 12px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:8px; }
    .store { font-size:.74rem; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
    .value { font-size:1.7rem; font-weight:800; color:var(--accent); line-height:1.1; }
    .title { font-size:.92rem; line-height:1.3; }
    .code { display:flex; align-items:center; justify-content:space-between; gap:8px; background:var(--bg); border:1px dashed var(--accent); border-radius:10px; padding:8px 10px; font-family:ui-monospace,Consolas,monospace; font-weight:700; letter-spacing:.04em; }
    .copy { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:6px 10px; font:inherit; font-weight:700; cursor:pointer; font-size:.82rem; }
    .copy.done { background:var(--green); }
    .rule { color:var(--muted); font-size:.82rem; }
    .go { margin-top:auto; display:block; text-align:center; background:#1f1f27; color:var(--text); text-decoration:none; font-weight:700; border-radius:10px; padding:10px; border:1px solid var(--line); }
    .empty { color:var(--muted); text-align:center; padding:40px 0; }
    footer { color:#5f6470; text-align:center; font-size:.8rem; padding:24px 16px 40px; }
    footer a { color:inherit; }
  </style>
</head>
<body>
  <header>
    <strong>Vini Achados · Cupons</strong>
    <nav>
      <a href="/ofertas/">Ofertas</a>
      <a class="on" href="/cupons/">Cupons</a>
    </nav>
  </header>

  <main>
    <div class="bar">
      <input id="q" type="search" placeholder="Buscar cupom ou produto" autocomplete="off">
    </div>
    <div class="chips" id="chips"></div>
    <p class="count" id="count"></p>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>Nenhum cupom encontrado.</p>
  </main>

  <footer><a href="/privacidade.html">Política de privacidade</a> · Links de afiliado: ao comprar, podemos ganhar uma comissão sem custo para você.</footer>

  <script>
    const STORES = { amazon: 'Amazon', shopee: 'Shopee', mercadolivre: 'Mercado Livre' };
    const state = { store: 'todos', q: '', items: [] };
    const withCoupon = (items) => items.filter((p) => p.coupon);

    function renderChips() {
      const stores = ['todos', ...new Set(withCoupon(state.items).map((p) => p.store))];
      document.getElementById('chips').replaceChildren(...stores.map((s) => {
        const b = document.createElement('button');
        b.className = 'chip' + (state.store === s ? ' on' : '');
        b.textContent = s === 'todos' ? 'Todas as lojas' : (STORES[s] || s);
        b.onclick = () => { state.store = s; draw(); };
        return b;
      }));
    }

    async function copy(code, btn) {
      try {
        await navigator.clipboard.writeText(code);
      } catch {
        const t = document.createElement('textarea');
        t.value = code; document.body.append(t); t.select(); document.execCommand('copy'); t.remove();
      }
      btn.textContent = 'Copiado';
      btn.classList.add('done');
      setTimeout(() => { btn.textContent = 'Copiar'; btn.classList.remove('done'); }, 1500);
    }

    function card(p) {
      const a = document.createElement('article');
      a.className = 'card';
      a.innerHTML = `
        <span class="store"></span>
        <div class="value"></div>
        <div class="title"></div>
        <div class="code"><span class="c"></span><button class="copy" type="button">Copiar</button></div>
        <div class="rule"></div>
        <a class="go" target="_blank" rel="noopener sponsored">Ir para a oferta</a>`;
      a.querySelector('.store').textContent = STORES[p.store] || p.store;
      a.querySelector('.value').textContent = p.couponInfo || 'Cupom';
      a.querySelector('.title').textContent = p.title;
      a.querySelector('.c').textContent = p.coupon;
      a.querySelector('.rule').textContent = p.price ? `Preço com cupom: R$ ${p.price}` : '';
      a.querySelector('.copy').onclick = (e) => copy(p.coupon, e.currentTarget);
      a.querySelector('.go').href = p.affiliateUrl;
      return a;
    }

    function visible() {
      const q = state.q.trim().toLowerCase();
      return withCoupon(state.items).filter((p) =>
        (state.store === 'todos' || p.store === state.store) &&
        (!q || p.title.toLowerCase().includes(q) || p.coupon.toLowerCase().includes(q)));
    }

    function draw() {
      renderChips();
      const list = visible();
      document.getElementById('grid').replaceChildren(...list.map(card));
      document.getElementById('count').textContent = `${list.length} cupom${list.length === 1 ? '' : 'ns'}`;
      document.getElementById('empty').hidden = list.length > 0;
    }

    document.getElementById('q').addEventListener('input', (e) => { state.q = e.target.value; draw(); });

    fetch('../dados/ofertas.json', { cache: 'no-cache' })
      .then((r) => r.json())
      .then((data) => { state.items = data.items || []; draw(); })
      .catch(() => { document.getElementById('empty').hidden = false; });
  </script>
</body>
</html>
