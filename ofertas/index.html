<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ofertas com link de afiliado - Vini Achados</title>
  <meta name="description" content="Ofertas selecionadas da Amazon, Shopee e Mercado Livre, com cupom quando existe.">
  <style>
    :root { --bg:#0b0b0d; --card:#15151a; --line:#26262e; --text:#f3f4f6; --muted:#9ca3af; --accent:#f26522; --green:#22c55e; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
    header strong { font-size:1.05rem; }
    nav a { color:var(--muted); text-decoration:none; margin-left:14px; font-size:.92rem; }
    nav a.on { color:var(--text); border-bottom:2px solid var(--accent); padding-bottom:2px; }
    main { max-width:1200px; margin:0 auto; padding:16px; }
    .bar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
    .bar input, .bar select { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font:inherit; }
    .bar input { flex:1 1 220px; }
    .chips { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
    .chip { background:var(--card); border:1px solid var(--line); color:var(--muted); border-radius:999px; padding:6px 14px; cursor:pointer; font:inherit; font-size:.88rem; }
    .chip.on { color:#fff; border-color:var(--accent); background:rgba(242,101,34,.15); }
    .count { color:var(--muted); font-size:.88rem; margin:0 0 12px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; }
    .img { aspect-ratio:1/1; background:#fff; display:grid; place-items:center; }
    .img img { width:100%; height:100%; object-fit:contain; }
    .body { padding:12px; display:flex; flex-direction:column; gap:6px; flex:1; }
    .store { font-size:.74rem; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
    .title { font-weight:600; font-size:.95rem; line-height:1.3; }
    .prices { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
    .old { color:var(--muted); text-decoration:line-through; font-size:.85rem; }
    .new { font-size:1.15rem; font-weight:800; }
    .off { background:rgba(34,197,94,.15); color:var(--green); border-radius:6px; padding:2px 6px; font-size:.78rem; font-weight:700; }
    .coupon { font-size:.82rem; color:#fcd34d; }
    .go { margin-top:auto; display:block; text-align:center; background:var(--accent); color:#fff; text-decoration:none; font-weight:700; border-radius:10px; padding:10px; }
    .empty { color:var(--muted); text-align:center; padding:40px 0; }
    footer { color:#5f6470; text-align:center; font-size:.8rem; padding:24px 16px 40px; }
    footer a { color:inherit; }
  </style>
</head>
<body>
  <header>
    <strong>Vini Achados · Ofertas</strong>
    <nav>
      <a class="on" href="/ofertas/">Ofertas</a>
      <a href="/cupons/">Cupons</a>
    </nav>
  </header>

  <main>
    <div class="bar">
      <input id="q" type="search" placeholder="Buscar produto" autocomplete="off">
      <select id="sort" aria-label="Ordenar">
        <option value="recent">Mais recentes</option>
        <option value="off">Maior desconto</option>
        <option value="price-asc">Menor preço</option>
      </select>
    </div>
    <div class="chips" id="chips"></div>
    <p class="count" id="count"></p>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>Nenhuma oferta encontrada.</p>
  </main>

  <footer><a href="/privacidade.html">Política de privacidade</a> · Links de afiliado: ao comprar, podemos ganhar uma comissão sem custo para você.</footer>

  <script>
    const STORES = { amazon: 'Amazon', shopee: 'Shopee', mercadolivre: 'Mercado Livre' };
    const num = (s) => Number(String(s || '').replace(/\./g, '').replace(',', '.'));
    const state = { store: 'todos', q: '', sort: 'recent', items: [] };

    function discount(p) {
      const a = num(p.oldPrice), b = num(p.price);
      return a > b && b > 0 ? Math.round((1 - b / a) * 100) : 0;
    }

    function renderChips() {
      const stores = ['todos', ...new Set(state.items.map((p) => p.store))];
      document.getElementById('chips').replaceChildren(...stores.map((s) => {
        const b = document.createElement('button');
        b.className = 'chip' + (state.store === s ? ' on' : '');
        b.textContent = s === 'todos' ? 'Todas as lojas' : (STORES[s] || s);
        b.onclick = () => { state.store = s; draw(); };
        return b;
      }));
    }

    function card(p) {
      const d = discount(p);
      const a = document.createElement('article');
      a.className = 'card';
      a.innerHTML = `
        <div class="img">${p.image ? `<img src="${p.image}" alt="" loading="lazy">` : ''}</div>
        <div class="body">
          <span class="store"></span>
          <div class="title"></div>
          <div class="prices">
            ${p.oldPrice ? `<span class="old">R$ ${p.oldPrice}</span>` : ''}
            <span class="new">R$ ${p.price}</span>
            ${d ? `<span class="off">-${d}%</span>` : ''}
          </div>
          ${p.coupon ? `<div class="coupon">Cupom ${p.coupon}${p.couponInfo ? ' · ' + p.couponInfo : ''}</div>` : ''}
          <a class="go" href="${p.affiliateUrl}" target="_blank" rel="noopener sponsored">Ver oferta</a>
        </div>`;
      a.querySelector('.store').textContent = STORES[p.store] || p.store;
      a.querySelector('.title').textContent = p.title;
      return a;
    }

    function visible() {
      const q = state.q.trim().toLowerCase();
      let list = state.items.filter((p) =>
        (state.store === 'todos' || p.store === state.store) &&
        (!q || p.title.toLowerCase().includes(q)));
      if (state.sort === 'off') list = [...list].sort((x, y) => discount(y) - discount(x));
      if (state.sort === 'price-asc') list = [...list].sort((x, y) => num(x.price) - num(y.price));
      return list;
    }

    function draw() {
      renderChips();
      const list = visible();
      document.getElementById('grid').replaceChildren(...list.map(card));
      document.getElementById('count').textContent = `${list.length} oferta${list.length === 1 ? '' : 's'}`;
      document.getElementById('empty').hidden = list.length > 0;
    }

    document.getElementById('q').addEventListener('input', (e) => { state.q = e.target.value; draw(); });
    document.getElementById('sort').addEventListener('change', (e) => { state.sort = e.target.value; draw(); });

    fetch('../dados/ofertas.json', { cache: 'no-cache' })
      .then((r) => r.json())
      .then((data) => { state.items = data.items || []; draw(); })
      .catch(() => { document.getElementById('empty').hidden = false; });
  </script>
</body>
</html>
